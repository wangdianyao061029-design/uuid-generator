<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive solar system explorer">
<title>Solaris · Solar System Explorer</title>
<style>
:root{color-scheme:dark;--cyan:#62e8ff;--muted:#91a4c4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030611;color:#edf5ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow:hidden}#space{position:fixed;inset:0;width:100%;height:100%;cursor:grab}#space:active{cursor:grabbing}
.hud{position:fixed;z-index:2;inset:0;pointer-events:none;padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{letter-spacing:.2em;color:var(--cyan);font-size:11px;font-weight:700;text-transform:uppercase}.brand{font-size:clamp(27px,4vw,48px);line-height:1;font-weight:800;letter-spacing:-.05em;margin-top:8px}.brand span{color:var(--cyan)}
.pill,.panel{background:rgba(7,14,32,.72);border:1px solid rgba(135,184,255,.18);box-shadow:0 12px 50px #0006;backdrop-filter:blur(16px);border-radius:16px}.pill{padding:10px 14px;color:var(--muted);font-size:12px}.pill b{color:#fff;font-weight:600}
.bottom{display:flex;gap:12px;align-items:flex-end}.panel{pointer-events:auto;padding:16px}.info{width:min(310px,calc(100vw - 40px))}.info h2{margin:0 0 5px;font-size:23px}.info p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.55}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:9px 10px;border-radius:10px;background:#ffffff09}.stat small{display:block;color:#7185a6;font-size:10px}.stat strong{font-size:13px}
.controls{margin-left:auto;display:flex;align-items:center;gap:8px}.controls button{pointer-events:auto;border:1px solid #8bb9e933;background:#ffffff0d;color:#eef6ff;border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;font-size:12px}.controls button:hover,.controls button.active{background:#62e8ff1c;border-color:#62e8ff88;color:var(--cyan)}.zoom{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.zoom input{accent-color:var(--cyan);width:100px}
.legend{position:absolute;right:clamp(20px,4vw,48px);top:132px;display:grid;gap:7px;pointer-events:auto}.legend button{display:flex;align-items:center;gap:8px;background:none;border:0;color:#9badc8;font-size:11px;cursor:pointer;text-align:left}.legend button:hover{color:#fff}.dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 10px currentColor}
@media(max-width:650px){body{overflow:auto}.hud{padding:20px;min-height:100vh}.pill{display:none}.legend{display:none}.bottom{align-items:stretch;flex-direction:column}.controls{margin:0;flex-wrap:wrap}.zoom{flex:1}.zoom input{width:100%}.brand{font-size:30px}}
</style>
</head>
<body>
<canvas id="space" aria-label="Interactive animated solar system"></canvas>
<main class="hud">
  <div class="top"><div><div class="eyebrow">ORBITAL ATLAS · 01</div><div class="brand">Solar<span>is</span></div></div><div class="pill">LIVE SIMULATION · <b id="clock">00:00:00</b></div></div>
  <div class="legend" id="legend"></div>
  <div class="bottom">
    <section class="panel info"><h2 id="planetName">The Sun</h2><p id="planetDescription">The star at the heart of our system, powering every orbit with its gravity and light.</p><div class="stats"><div class="stat"><small>DIAMETER</small><strong id="diameter">1,391,000 km</strong></div><div class="stat"><small>ORBITAL PERIOD</small><strong id="period">—</strong></div></div></section>
    <section class="panel controls"><button id="pause">Ⅱ Pause</button><button id="reset">↺ Reset view</button><label class="zoom">MAGNIFY <input id="zoom" type="range" min="0.65" max="2.1" value="1" step=".05"></label></section>
  </div>
</main>
<script>
const canvas=document.querySelector('#space'),ctx=canvas.getContext('2d'),DPR=()=>Math.min(devicePixelRatio,2);
const planets=[
 {name:'Mercury',color:'#b8b2a7',glow:'#f6c67a',a:70,size:3,period:'88 days',diameter:'4,879 km',desc:'A tiny, cratered world racing closest to the Sun.'},
 {name:'Venus',color:'#e4b46a',glow:'#ffdca0',a:105,size:5,period:'225 days',diameter:'12,104 km',desc:'A cloud-shrouded world with a dense, superheated atmosphere.'},
 {name:'Earth',color:'#4c9dff',glow:'#68c7ff',a:145,size:5.8,period:'365 days',diameter:'12,742 km',desc:'Our blue home, rich with oceans, life, and one bright Moon.'},
 {name:'Mars',color:'#d56a4c',glow:'#ff9870',a:190,size:4.2,period:'687 days',diameter:'6,779 km',desc:'The red planet, marked by ancient valleys and polar ice.'},
 {name:'Jupiter',color:'#d8a878',glow:'#f7d4a2',a:260,size:11,period:'11.86 years',diameter:'139,820 km',desc:'A colossal gas giant with striped clouds and a famous storm.'},
 {name:'Saturn',color:'#d7b777',glow:'#ffe3a2',a:340,size:9,period:'29.45 years',diameter:'116,460 km',desc:'The ringed jewel of the solar system, sculpted by icy debris.'},
 {name:'Uranus',color:'#79d9df',glow:'#b4fbff',a:415,size:7,period:'84 years',diameter:'50,724 km',desc:'An ice giant rotating on its side beneath a blue haze.'},
 {name:'Neptune',color:'#477be7',glow:'#83a9ff',a:485,size:7,period:'164.8 years',diameter:'49,244 km',desc:'A deep-blue, supersonic world at the frontier of the system.'}
];
let W,H,scale=1,selected=2,running=true,elapsed=0,last=performance.now(),drag={x:0,y:0,active:false},view={x:0,y:0};
const stars=Array.from({length:420},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.2,a:Math.random()*.8+.2}));
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR();canvas.height=H*DPR();ctx.setTransform(DPR(),0,0,DPR(),0,0)}addEventListener('resize',resize);resize();
function center(){return{x:W/2+view.x,y:H/2+view.y}}
function orbitRadius(p){return p.a*(Math.min(W,H)/650)*scale}
function drawStars(t){ctx.fillStyle='#030611';ctx.fillRect(0,0,W,H);for(const s of stars){let tw=s.a+Math.sin(t*.001+s.x*30)*.16;ctx.fillStyle=`rgba(190,220,255,${tw})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill()}}
function draw(t){drawStars(t);let c=center(), f=Math.min(W,H)/650*scale;
 ctx.save();ctx.translate(c.x,c.y);let max=planets.at(-1).a*f;let grad=ctx.createRadialGradient(0,0,10,0,0,max*1.3);grad.addColorStop(0,'#1b2c57');grad.addColorStop(1,'transparent');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,max*1.3,0,Math.PI*2);ctx.fill();
 for(const p of planets){let r=orbitRadius(p);ctx.strokeStyle='rgba(114,164,230,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke()}
 drawSun(t);
 planets.forEach((p,i)=>{let angle=elapsed*(.00032/(1+i*.36))+(i*.86);let x=Math.cos(angle)*orbitRadius(p),y=Math.sin(angle)*orbitRadius(p)*.93; p._x=x+c.x;p._y=y+c.y;p._angle=angle;drawTrail(p,x,y,i);drawPlanet(p,x,y,i,t)});
 ctx.restore();
 requestAnimationFrame(loop)}
function drawSun(t){let pulse=1+Math.sin(t*.002)*.025,g=ctx.createRadialGradient(0,0,8,0,0,48*pulse);g.addColorStop(0,'#fffbd0');g.addColorStop(.24,'#ffd34e');g.addColorStop(.7,'#ff8e27');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,55*pulse,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd35b';ctx.shadowColor='#ff9d27';ctx.shadowBlur=25;ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
function drawTrail(p,x,y,i){ctx.save();ctx.rotate(p._angle);let len=18+i*3;let g=ctx.createLinearGradient(-len,0,0,0);g.addColorStop(0,'transparent');g.addColorStop(1,p.glow+'66');ctx.strokeStyle=g;ctx.lineWidth=Math.max(1,p.size*.65);ctx.beginPath();ctx.moveTo(-len,-y*.02);ctx.lineTo(0,0);ctx.stroke();ctx.restore()}
function drawPlanet(p,x,y,i,t){let active=i===selected, r=p.size*(active?1.18:1);ctx.save();if(active){ctx.strokeStyle=p.glow+'aa';ctx.lineWidth=1;ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(x,y,r+8+Math.sin(t*.004)*2,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}let g=ctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r*1.5);g.addColorStop(0,'#fff');g.addColorStop(.18,p.color);g.addColorStop(1,'#080c18');ctx.fillStyle=g;ctx.shadowColor=p.glow;ctx.shadowBlur=active?18:8;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(p.name==='Saturn'){ctx.strokeStyle='#e7cb91aa';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,r*1.9,r*.55,-.15,0,Math.PI*2);ctx.stroke()}if(p.name==='Earth'){ctx.fillStyle='#77d58c';ctx.beginPath();ctx.arc(x-r*.25,y-r*.2,r*.35,0,Math.PI*2);ctx.fill()}ctx.fillStyle=active?'#fff':'#9baecb';ctx.font=`${active?12:10}px Inter, sans-serif`;ctx.textAlign='center';ctx.fillText(p.name,x,y+r+16);ctx.restore()}
function select(i){selected=i;const p=planets[i];document.querySelector('#planetName').textContent=p.name;document.querySelector('#planetDescription').textContent=p.desc;document.querySelector('#diameter').textContent=p.diameter;document.querySelector('#period').textContent=p.period;document.querySelectorAll('.legend button').forEach((b,n)=>b.classList.toggle('active',n===i))}
function loop(t){if(running)elapsed+=t-last;last=t;document.querySelector('#clock').textContent=new Date(elapsed).toISOString().slice(11,19);draw(t)}
planets.forEach((p,i)=>{let b=document.createElement('button');b.innerHTML=`<i class="dot" style="color:${p.glow};background:${p.glow}"></i>${p.name}`;b.onclick=()=>select(i);document.querySelector('#legend').append(b)});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX-view.x,y:e.clientY-view.y,active:true};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag.active){view.x=e.clientX-drag.x;view.y=e.clientY-drag.y}});canvas.addEventListener('pointerup',()=>drag.active=false);
canvas.addEventListener('click',e=>{let hit=planets.findIndex(p=>Math.hypot(e.clientX-p._x,e.clientY-p._y)<18);if(hit>=0)select(hit)});
document.querySelector('#pause').onclick=e=>{running=!running;e.target.textContent=running?'Ⅱ Pause':'▶ Resume'};document.querySelector('#reset').onclick=()=>{view={x:0,y:0};scale=1;document.querySelector('#zoom').value=1};document.querySelector('#zoom').oninput=e=>scale=+e.target.value;select(selected);requestAnimationFrame(loop);
</script>
</body>
</html>
